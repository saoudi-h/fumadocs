core:changelogs:
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n---\n\n### Unions of `const` members render as a labelled select\n\n- In the playground, a `oneOf`/`anyOf` whose members are all `const` is one select labelled by each member's `title`, instead of a switch between members.\n"
    filename: 2026-10-23-openapi-labelled-const-options.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n---\n\n### Search sync on Vercel\n\n- The Next.js sync script of `feature search` finds `static.json` when Next.js builds with an adapter, like on Vercel.\n"
    filename: 2026-10-23-search-sync-next-adapter.md
    v: 0.0.0
